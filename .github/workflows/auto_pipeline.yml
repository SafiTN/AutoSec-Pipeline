name: AutoSec-Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run full main.py pipeline (requires reachable Ollama endpoint)"
        required: false
        default: "false"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: |
          ruff check .

      - name: Check formatting with ruff
        run: ruff format --check .

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core

      - name: Validate configuration loader
        run: |
          python -m core.config_loader

      - name: Run unit tests with coverage gate
        run: |
          python -m pytest -v --cov=core --cov=modules --cov-report=xml --cov-report=term --cov-fail-under=86

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      # SAFETY: this manual run must never publish or upload anything. No upload
      # credentials are configured here and none may be added without owner approval.
      - name: Guard against allow_fallback in manual full run
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_pipeline == 'true'
        run: |
          python - <<'PY'
          import sys
          import yaml
          with open("config/settings.yaml", encoding="utf-8") as fh:
              cfg = yaml.safe_load(fh) or {}
          hits = []
          def walk(node, path=""):
              if isinstance(node, dict):
                  for k, v in node.items():
                      walk(v, f"{path}.{k}" if path else str(k))
              elif path.split(".")[-1] == "allow_fallback" and node is True:
                  hits.append(path)
          walk(cfg)
          if hits:
              sys.exit(f"allow_fallback must be false for CI runs: {hits}")
          print("allow_fallback is false: ok")
          PY

      - name: Optionally run full pipeline on manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_pipeline == 'true'
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2.5-coder:7b' }}
        run: |
          # Exit 2 = pending human review (ADR 0004): not a failure. Never pass --approve/--reject in CI.
          set +e
          python main.py
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::notice::Pipeline is pending human review (exit 2); approve or reject locally."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi