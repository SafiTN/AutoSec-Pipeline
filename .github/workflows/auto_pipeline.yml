name: AutoSec-Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run full main.py pipeline (requires reachable Ollama endpoint)"
        required: false
        default: "false"

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Validate configuration loader
        run: |
          python -m core.config_loader

      - name: Run unit tests with pytest
        run: |
          pytest -v

      - name: Optionally run full pipeline on manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_pipeline == 'true'
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2.5-coder:7b' }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python main.py