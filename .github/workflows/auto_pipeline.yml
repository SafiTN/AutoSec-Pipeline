name: AutoSec-Pipeline CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      run_full_pipeline:
        description: "Run full main.py pipeline (requires reachable Ollama endpoint)"
        required: false
        default: "false"

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Validate configuration loader
        run: |
          python -m core.config_loader

      - name: Run unit tests with coverage gate
        run: |
          python -m pytest -v --cov=core --cov=modules --cov-report=xml --cov-report=term --cov-fail-under=86

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Optionally run full pipeline on manual dispatch
        if: github.event_name == 'workflow_dispatch' && inputs.run_full_pipeline == 'true'
        env:
          OLLAMA_BASE_URL: ${{ secrets.OLLAMA_BASE_URL || 'http://localhost:11434' }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'qwen2.5-coder:7b' }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
          python main.py