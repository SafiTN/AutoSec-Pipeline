# Minimal, conservative lint config (T13). Formatting is not enforced in CI:
# `ruff format` would rewrite most files, so it is left for a dedicated change.
line-length = 120
target-version = "py310"
extend-exclude = ["venv", ".venv", ".sandbox_runs", "output", "output_media"]

[lint]
select = ["E", "F", "W", "I"]
# E501: long lines are tolerated until a dedicated formatting pass.
ignore = ["E501"]

[lint.isort]
known-first-party = ["core", "modules"]
