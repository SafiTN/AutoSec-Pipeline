project:
  name: "AutoSec-Pipeline"
  version: "1.0.0"
  log_level: "INFO"

paths:
  output_dir: "output"
  media_dir: "output_media"
  default_video_filename: "cyber_episode.mp4"
  manifest_filename: "last_episode_manifest.json"
  covered_cves_filename: "covered_cves.json"
  pending_review_filename: "pending_review.json"  # under paths.output_dir (human review gate, ADR 0004)

review:
  enabled: true                      # human review gate before rendering (never applies to sample runs)
  cvss_threshold: 9.0                # CVSS >= this value requires `python main.py --approve`
  review_required: false             # true = gate every non-sample run
  fail_closed_on_unknown_cvss: true  # unknown/non-numeric CVSS also requires review

ollama:
  base_url: "http://localhost:11434"
  model: "qwen2.5-coder:7b"
  timeout_sec: 120
  temperature: 0.2

nvd:
  api_url: "https://services.nvd.nist.gov/rest/json/cves/2.0"
  lookback_days: 14
  max_results: 10
  default_limit: 3
  timeout_sec: 20
  max_retries: 2
  allow_fallback: false

prompt_optimizer:
  language: "en"
  style: "concise_technical"
  default_max_scenes: 3
  hook_rotation: true            # pick scene-1 hook style deterministically from the CVE id
  hook_styles: ["question", "number", "scenario"]
  max_bullets: 3
  max_bullet_chars: 48
  max_takeaway_chars: 160
  max_hook_words: 25

script_validation:
  enabled: true
  max_retries: 2   # extra LLM attempts after the first
  forbidden_terms:
    - "payload"
    - "exploit code"
    - "shellcode"
    - "reverse shell"
    - "proof of concept"
    - "poc"
    - "step-by-step exploit"
    - "weaponiz"

media:
  output_directory: "output_media"
  slides_directory: "output_media/slides"
  visual_mode: "slide"
  voice: "en-US-GuyNeural"
  tts_voice: "en-US-GuyNeural"
  video_fps: 24
  fps: 24
  resolution:
    width: 1280
    height: 720
  # Slide styling (T08). Font paths are project-relative; sizes are in pixels
  # at 1280x720 and are scaled for other resolutions.
  slide:
    fonts:
      regular: "assets/fonts/Inter-Regular.ttf"
      bold: "assets/fonts/Inter-Bold.ttf"
      mono: ""  # optional; empty falls back to the regular font
    sizes:
      title: 46
      body: 30
      header: 22
      badge: 22
      takeaway: 28
    min_font_size: 18
    margin: 48
    max_bullets: 3
    sample_label: "SAMPLE"  # marker drawn on every slide of sample (non-real) runs

sandbox:   # best-effort limits, NOT a security boundary (see docs/adr/0003)
  timeout_sec: 10            # hard maximum wall-clock per run (spec value is clamped to this)
  max_memory_mb: 256         # per-process memory cap (POSIX RLIMIT_AS / Windows Job Object)
  max_output_bytes: 65536    # stdout and stderr each, truncated beyond this
  max_processes: 1           # active process limit for the child
  work_root: ".sandbox_runs" # project-relative; per-run dirs are created and removed here
  allow_unlimited: false     # Windows: run even if Job Object limits cannot be applied (default: refuse)

harness:
  enabled_by_default: false
  max_iterations: 3          # max repair attempts per task (int >= 1)
  target_score: 90.0         # stop early once a passing attempt reaches this score
  pass_threshold: 80.0       # minimum judge score for a candidate to count as passed

ai:
  provider: "ollama"
  base_url: "http://localhost:11434"
  model: "qwen2.5-coder:7b"
  timeout_sec: 120
  temperature: 0.2